<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScanFlow – QR Terminal</title>
  <link rel="icon" type="image/png" href="scanflow_logo_transparent.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">

  <div class="page active" id="page-qr">
    <div class="content no-nav">
      <div class="qr-wrap">
        <div class="auth-logo">ScanFlow</div>
        <div class="section-label">QR Terminal</div>

        <div class="qr-box">
          <div class="qr-icon">⬛</div>
          <div class="qr-lbl">To Do – dinamički QR kod</div>
        </div>
      </div>
    </div>

    <button class="btn btn-secondary qr-logout" onclick="logout()">🚪 Odjava</button>
  </div>

</div>

<script src="app.js"></script>
<script>
  function logout() {
    window.location.href = 'index.html';
  }
</script>
</body>
</html>
